<app-headers></app-headers>
 <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
<section class="contact-hero">
    <div class="overlay"></div>
    <div class="container text-center hero-text">
        <h1>Contact Ghamandi Lassi</h1>
        <p>Pride in Every Sip • We’d love to hear from you</p>
    </div>
</section>

<section class="contact-section">
    <div class="container">
        <div class="row g-4">

            <!-- Contact Form -->
            <div class="col-lg-6">
                <div class="contact-card slide-left">
                    <h3>Get In Touch</h3>

                    <form>
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" placeholder="Name">
                            <label>Your Name</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="tel" class="form-control" placeholder="Phone">
                            <label>Mobile Number</label>
                        </div>

                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" placeholder="Email">
                            <label>Email Address</label>
                        </div>

                        <div class="form-floating mb-3">
                            <textarea class="form-control" style="height:120px" placeholder="Message"></textarea>
                            <label>Your Message</label>
                        </div>

                        <button class="btn btn-warning w-100 rounded-pill submit-btn">
                            Send Message
                        </button>
                    </form>
                </div>
            </div>

            <!-- Contact Info + Map -->
            <div class="col-lg-6">
                <div class="contact-card slide-right">
                    <h3>Visit Us</h3>

                    <p><i class="bi bi-geo-alt-fill"></i> 6-No market Madhya Pradesh , India</p>
                    <p><i class="bi bi-telephone-fill"></i> +91 9826088332</p>
                    <p><i class="bi bi-envelope-fill"></i> {{ email }}</p>

                    <div class="map-box">
                        <iframe
                            src="https://www.google.com/maps?q=6-No+market+Madhya+Pradesh,+India&output=embed"
                            allowfullscreen=""
                            loading="lazy">
                        </iframe>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>
